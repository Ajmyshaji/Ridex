{% extends 'User/Head.html' %}
{% block content %}

<style>
    .edit-title{
        font-size:32px;
        font-weight:800;
        font-style:italic;
        color:#d4a15a;   /* Ridex Gold */
    }

    .edit-line{
        width:120px;
        height:4px;
        background:#d4a15a;
        margin:6px auto 10px;
        border-radius:4px;
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <!-- Edit Profile Card -->
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">

                    <!-- Title -->
                    <div class="text-center mb-4">
                        <h3 class="edit-title">Edit Profile</h3>
                        <div class="edit-line"></div>
                        <p class="text-muted mb-0">Update your personal details</p>
                    </div>

                    <!-- Form -->
                    <form action="" method="post">
                        {% csrf_token %}

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Name</label>
                            <input required type="text" class="form-control"
                                   name="txt_name"
                                   value="{{Data.user_name}}"
                                   pattern="^[A-Z]+[a-zA-Z ]*$"
                                   title="First letter must be capital and only alphabets allowed">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input required type="email" class="form-control"
                                   name="txt_email"
                                   value="{{Data.user_email}}">
                        </div>

                        <!-- Contact -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contact</label>
                            <input required type="text" class="form-control"
                                   name="txt_contact"
                                   value="{{Data.user_contact}}">
                        </div>

                        <!-- Address -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Address</label>
                            <textarea required class="form-control"
                                      name="txt_address"
                                      rows="4">{{Data.user_address}}</textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary px-4">
                                Update Profile
                            </button>
                            <a href="{% url 'User:Profile' %}" class="btn btn-primary px-4">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'User:Profile' %}";
</script>
{% endif %}

{% endblock content %}
