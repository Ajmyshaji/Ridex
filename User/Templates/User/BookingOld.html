<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- JQUERY -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
let map;
let fromMarker = null;
let toMarker = null;
let routeLine = null;
let selectingFrom = true;

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // KM
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

$('#openMap').click(function(){
    $('#map-overlay').show();

    setTimeout(function(){
        if(!map){
            map = L.map('map').setView([10.8505, 76.2711], 7);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            map.on('click', async function(e){
                if(selectingFrom){

                    if(fromMarker) map.removeLayer(fromMarker);
                    if(routeLine) map.removeLayer(routeLine);

                    fromMarker = L.marker(e.latlng).addTo(map)
                        .bindPopup("FROM Location").openPopup();

                    $('#from_lat').val(e.latlng.lat);
                    $('#from_lng').val(e.latlng.lng);

                    selectingFrom = false;
                    alert("FROM selected. Now select TO location");

                } else {

                    if(toMarker) map.removeLayer(toMarker);
                    if(routeLine) map.removeLayer(routeLine);

                    toMarker = L.marker(e.latlng).addTo(map)
                        .bindPopup("TO Location").openPopup();

                    $('#to_lat').val(e.latlng.lat);
                    $('#to_lng').val(e.latlng.lng);

                    let fromLat = parseFloat($('#from_lat').val());
                    let fromLng = parseFloat($('#from_lng').val());
                    let toLat = e.latlng.lat;
                    let toLng = e.latlng.lng;

                    // Draw route line
                    routeLine = L.polyline([
                        [fromLat, fromLng],
                        [toLat, toLng]
                    ]).addTo(map);

                    // Calculate distance
                    let distance = calculateDistance(fromLat, fromLng, toLat, toLng);
                    distance = distance.toFixed(2);
                    $('#distance_km').val(distance);

                    // Reverse geocode names
                    let fromName = await getPlaceName(fromLat, fromLng);
                    let toName = await getPlaceName(toLat, toLng);

                    $('#distanceBox').html(
                        // "<div class="section-title">Location</div>" +
                        "<strong>FROM:</strong> " + fromName + "<br>" +
                        "<strong>TO:</strong> " + toName + "<br>" +
                        "<strong>Total Distance:</strong> " + distance + " KM"
                    );

                    selectingFrom = true;
                }
            });

        }
        map.invalidateSize();
    }, 200);
});

$('#closeMap').click(function(){
    $('#map-overlay').hide();
});
</script>


<!-- Show place name instead of lat and long -->
<script>
async function getPlaceName(lat, lng) {
    try {
        const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`,
            {
                headers: {
                    'Accept': 'application/json'
                }
            }
        );

        const data = await response.json();

        if (!data || !data.address) {
            return "Location not found";
        }

        const address = data.address;

        const district =
            address.state_district ||
            address.district ||
            address.state ||
            "";

        const place =
            address.city ||
            address.town ||
            address.village ||
            address.suburb ||
            address.hamlet ||
            "";

        return `${district}${place ? ", " + place : ""}`;

    } catch (error) {
        console.error("Reverse geocoding error:", error);
        return "Unknown location";
    }
}
</script>

<script>
function toggleDates() {
    var type = document.getElementById("sel_booktype").value;

    var fromDiv = document.getElementById("fromDateDiv");
    var toDiv = document.getElementById("toDateDiv");
    
    if (type === "single") {
        fromDiv.style.display = "block";
        toDiv.style.display = "none";

        document.getElementById("fromDate").required = true;
        document.getElementById("toDate").required = false;

    } else if (type === "multiple") {
        fromDiv.style.display = "block";
        toDiv.style.display = "block";

        document.getElementById("fromDate").required = true;
        document.getElementById("toDate").required = true;

    } else {
        fromDiv.style.display = "none";
        toDiv.style.display = "none";
    }
}
</script>
