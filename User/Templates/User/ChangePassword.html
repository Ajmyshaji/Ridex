{% extends 'User/Head.html' %}
{% block content %}

<style>
    .change-title{
        font-size:32px;
        font-weight:800;
        font-style:italic;
        color:#d4a15a;   /* Ridex Gold */
    }

    .change-line{
        width:140px;
        height:4px;
        background:#d4a15a;
        margin:6px auto 10px;
        border-radius:4px;
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">

            <!-- Change Password Card -->
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">

                    <!-- Title -->
                    <div class="text-center mb-4">
                        <h3 class="change-title">Change Password</h3>
                        <div class="change-line"></div>
                        <p class="text-muted mb-0">Keep your account secure</p>
                    </div>

                    <!-- Form -->
                    <form action="" method="post">
                        {% csrf_token %}

                        <!-- Old Password -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Old Password</label>
                            <input required type="password"
                                   class="form-control"
                                   name="txt_oldpassword"
                                   placeholder="Enter old password">
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <input required type="password"
                                   class="form-control"
                                   name="txt_newpassword"
                                   placeholder="Enter new password">
                        </div>

                        <!-- Re-type Password -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Re-Type Password</label>
                            <input required type="password"
                                   class="form-control"
                                   name="txt_repassword"
                                   placeholder="Confirm new password">
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary px-4">
                                Change Password
                            </button>

                            <a href="{% url 'Guest:Login' %}" class="btn btn-primary px-4">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'Guest:Login' %}";
</script>
{% endif %}

{% endblock content %}
