{% extends 'User/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment</title>

<style>
:root{
    --ridex-gold:#C49A5A;
}

body{
    background:#f4f6fb;
    font-family:'Segoe UI', sans-serif;
}

/* PAGE TITLE */
.page-title{
    text-align:center;
    margin:35px 0;
}

.page-title h1{
    font-size:32px;
    font-weight:800;
    font-style:italic;
    color:var(--ridex-gold);
    display: inline-block;            /* so underline fits text width */
    border-bottom: 4px solid var(--ridex-gold); /* underline */
    padding-bottom: 8px;              /* space between text and underline */
}

/* PAYMENT CARD */
.payment-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
}

.payment-card{
    width:420px;
    max-width:95%;
    background:#ffffff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 18px 40px rgba(0,0,0,0.12);
    animation:fadeUp 0.6s ease;
}

/* TABLE */
.payment-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:25px;
}

.payment-table th,
.payment-table td{
    padding:14px;
    text-align:center;
    font-size:15px;
}

.payment-table th{
    background:var(--ridex-gold);
    color:#111;
    border-radius:10px 10px 0 0;
}

.payment-table td{
    background:#f9fafb;
    font-weight:600;
}

/* PAY BUTTON */
.pay-btn{
    width:100%;
    padding:14px;
    background:var(--ridex-gold);
    border:none;
    border-radius:30px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.pay-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(196,154,90,0.55);
}

/* ANIMATION */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="page-title">
    <h1>Payment</h1>
</div>

<div class="payment-wrapper">
    <div class="payment-card">

        <form method="post">
            {% csrf_token %}

            <table class="payment-table">
                <tr>
                    <th>Total Amount</th>
                </tr>
                <tr>
                    <td>₹ {{ bookingdata.booking_amount }}</td>
                </tr>
            </table>

            <input type="submit" value="Pay Now" class="pay-btn">
        </form>

    </div>
</div>

</body>
</html>

{% if msg %}
<script>
    alert("{{ msg }}");
    window.location = "{% url 'User:MyBooking' %}";
</script>
{% endif %}

{% endblock content %}
