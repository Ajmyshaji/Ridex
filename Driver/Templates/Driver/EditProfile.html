{% extends 'Driver/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:#f4f6fb;
}

/* RIDEX THEME */
:root{
    --ridex-gold:#C49A5A;
}

/* TITLE */
.page-title{
    text-align:center;
    margin:30px 0;
}

.page-title h1{
    font-size:32px;
    font-weight:800;
    font-style:italic;
    color:var(--ridex-gold);
}

/* CARD */
.edit-card{
    width:650px;
    max-width:95%;
    margin:auto;
    background:#ffffff;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.12);
    padding:35px 40px;
    animation:fadeUp 0.6s ease;
}

/* FORM GROUP */
.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
    color:#374151;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid #d1d5db;
    font-size:14px;
    background:#f9fafb;
    transition:0.3s;
}

.form-group input:focus,
.form-group textarea:focus{
    outline:none;
    border-color:var(--ridex-gold);
    background:#ffffff;
    box-shadow:0 0 6px rgba(196,154,90,0.35);
}

textarea{
    resize:none;
}

/* IMAGE PREVIEW */
.image-preview{
    margin-top:10px;
}

.image-preview img{
    width:110px;
    height:110px;
    border-radius:12px;
    object-fit:cover;
    border:3px solid var(--ridex-gold);
}

/* BUTTON */
.submit-btn{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:var(--ridex-gold);
    color:#111;
    border:none;
    border-radius:30px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(196,154,90,0.45);
}

/* ANIMATION */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */
@media(max-width:600px){
    .edit-card{
        padding:25px 22px;
    }
}
</style>
</head>

<body>

<div class="page-title">
    <h1>Edit Profile</h1>
</div>

<div class="edit-card">

<form action="" method="post" enctype="multipart/form-data">
{% csrf_token %}

    <div class="form-group">
        <label>Name</label>
        <input type="text" name="txt_name"
        value="{{Data.driver_name}}"
        required
        pattern="^[A-Z]+[a-zA-Z ]*$"
        title="Name Allows Only Alphabets, Spaces and First Letter Must Be Capital">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" name="txt_email" value="{{Data.driver_email}}" required>
    </div>

    <div class="form-group">
        <label>Contact</label>
        <input type="text" name="txt_contact" value="{{Data.driver_contact}}" required pattern="[7-9]{1}[0-9]{9}" 
                title="Phone number with 7-9 and remaing 9 digit with 0-9"/>
    </div>

    <div class="form-group">
        <label>Address</label>
        <textarea name="txt_address" rows="4" required>{{Data.driver_address}}</textarea>
    </div>

    <div class="form-group">
        <label>Photo</label>
        <input type="file" name="txt_photo">
        {% if Data %}
        <div class="image-preview">
            <img src="{{Data.driver_photo.url}}" alt="Profile Photo">
        </div>
        {% endif %}
    </div>

    <button type="submit" class="submit-btn">Update Profile</button>

</form>

</div>

</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'Driver:MyProfile' %}";
</script>
{% endif %}

{% endblock content %}
