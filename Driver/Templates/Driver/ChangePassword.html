{% extends 'Driver/Head.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

:root{
    --ridex-gold:#C49A5A;
}

body{
    background:#f4f6fb;
}

/* PAGE TITLE */
.page-title{
    text-align:center;
    margin:30px 0;
}

.page-title h1{
    font-size:30px;
    font-weight:800;
    font-style:italic;
    color:var(--ridex-gold);
}

/* CARD */
.password-card{
    width:480px;
    max-width:95%;
    margin:auto;
    background:#ffffff;
    border-radius:18px;
    padding:35px;
    box-shadow:0 18px 40px rgba(0,0,0,0.12);
    animation:fadeUp 0.6s ease;
}

/* FORM GROUP */
.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
    color:#374151;
}

.form-group input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #d1d5db;
    font-size:14px;
    background:#f9fafb;
    transition:0.3s;
}

.form-group input:focus{
    outline:none;
    border-color:var(--ridex-gold);
    background:#ffffff;
    box-shadow:0 0 6px rgba(196,154,90,0.45);
}

/* BUTTONS */
.btn-group{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
    gap:15px;
}

.submit-btn{
    flex:1;
    padding:13px;
    background:var(--ridex-gold);
    color:#111;
    border:none;
    border-radius:30px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(196,154,90,0.55);
}

.cancel-btn{
    flex:1;
    padding:13px;
    background:#e5e7eb;
    color:#1f2937;
    border:none;
    border-radius:30px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.cancel-btn:hover{
    background:#d1d5db;
}

/* ANIMATION */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */
@media(max-width:500px){
    .password-card{
        padding:25px 22px;
    }
    .btn-group{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="page-title">
    <h1>Change Password</h1>
</div>

<div class="password-card">

<form action="" method="post">
{% csrf_token %}

    <div class="form-group">
        <label>Old Password</label>
        <input type="password" name="txt_oldpassword" required>
    </div>

    <div class="form-group">
        <label>New Password</label>
        <input type="password" name="txt_newpassword" required>
    </div>

    <div class="form-group">
        <label>Re-Type Password</label>
        <input type="password" name="txt_repassword" required>
    </div>

    <div class="btn-group">
        <button type="submit" class="submit-btn">Change Password</button>
        <a href="{% url 'Guest:Login' %}">
            <button type="button" class="cancel-btn">Cancel</button>
        </a>
    </div>

</form>

</div>

</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'Guest:Login' %}";
</script>
{% endif %}

{% endblock content %}
