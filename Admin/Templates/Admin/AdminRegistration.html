<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminRegistration</title>
</head>
<body>
    <form action="" method="post">
         {% csrf_token %}
       <table border="1">
        <tr>
            <td>Name</td>
            <td><input required type="text" name="txt_name" value="{{editdata.admin_name}}" id="" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$"/></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input required type="text" name="txt_email" value="{{editdata.admin_email}}" id=""></td>
        </tr>
        <tr>
            <td>Password</td>
            <td><input required type="text" name="txt_password" value="{{editdata.admin_password}}" id=""></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="submit">
                <a href="{% url 'Admin:AdminRegistration' %}">
                   <input type="button" value="Cancel"></a>
            </td>
            <!-- <td></td> -->
        </tr>
       </table>
        <table border="1">
            <tr>
                <td>Sl.No</td>
                <td>Name</td>
                <td>Email</td>
                <td>Password</td>
                <td>Action</td>
            </tr>
            {% for i in regdata %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ i.admin_name }}</td>
                <td>{{ i.admin_email }}</td>
                <td>{{ i.admin_password }}</td>
                <td><a href="{% url 'Admin:delregistration' i.id %}">delete</a></td>
                <td><a href="{% url 'Admin:editregistration' i.id %}">edit</a></td>
            </tr>
            <!-- <tr>
                <td></td>
                <td></td>
                <td></td>
            </tr> -->
            {% endfor %}
         </table>
    </form>
</body>
</html>
{% if msg %}
<script>alert("{{msg}}")
    window.location="{% url 'Admin:AdminRegistration' %}"
</script>
{% endif %}
