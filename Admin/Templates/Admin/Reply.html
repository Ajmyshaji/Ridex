{% extends 'Admin/Head.html' %}
{% block content %}
<br>

<style>
    .reply-wrapper {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f9;
        font-family: Arial, sans-serif;
    }

    .reply-card {
        background: #ffffff;
        width: 420px;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .reply-title {
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        color: #333;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        font-weight: bold;
        display: block;
        margin-bottom: 6px;
        color: #444;
    }

    .form-group textarea {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        resize: none;
        outline: none;
    }

    .form-group textarea:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 5px rgba(13,110,253,0.3);
    }

    .btn-submit {
        width: 100%;
        background: #0d6efd;
        color: #fff;
        border: none;
        padding: 10px;
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
    }

    .btn-submit:hover {
        background: #084298;
    }
</style>

<div class="reply-wrapper">
    <div class="reply-card">
        <div class="reply-title">Reply to Complaint</div>

        <form action="" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Reply</label>
                <textarea name="txt_reply" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Reply</button>
        </form>
    </div>
</div>

{% if msg %}
<script>
    alert("{{ msg }}");
    window.location="{% url 'Admin:ViewComplaints' %}";
</script>
{% endif %}


{% endblock content %}
