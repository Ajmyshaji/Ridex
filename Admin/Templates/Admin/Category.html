<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category</title>
</head>
<body>
   <form action="" method="post">
     {% csrf_token %}
    <table border="1">
        <tr>
            <td>Category</td>
            <td><input required type="text" name="txt_category" value="{{editdata.category_name}}" id="" title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter" pattern="^[A-Z]+[a-zA-Z ]*$"/></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
               <input type="submit" value="submit">
               <a href="{% url 'Admin:Category' %}">
                   <input type="button" value="Cancel"></a>
            </td>
           
        </tr>
    </table>
    <table border="1">
        <tr>
            <td>Sl.No</td>
            <td>Category Name</td>
            <td colspan="2">Action</td>
        </tr>
         {% for i in categorydata %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.category_name}}</td>
            <td><a href="{% url 'Admin:delcategory' i.id %}">delete</a></td>
             <td><a href="{% url 'Admin:editcategory' i.id %}">edit</a></td>
        </tr>
        {% endfor %}
    </table>
     
   </form> 
</body>
</html>
{% if msg %}
<script>alert("{{msg}}")
    window.location="{% url 'Admin:Category' %}"
</script>
{% endif %}
