{% extends 'Guest/Head.html' %}
{% block content %}
{% load static %}

<!-- Registration Page Container -->
<div class="main-container" style="display:flex; min-height:100vh; background: #f4f6fb; justify-content:center; align-items:center; padding: 60px 0;">

    <!-- Registration Card -->
    <div class="register-box" style="background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); max-width: 700px; width: 100%;">
        
        <h2 style="text-align: center; color: #0f766e; margin-bottom: 25px;">User Registration</h2>
        
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- User Name -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>User Name</label>
                <input type="text" name="txt_name" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
            </div>

            <!-- Gender -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>Gender</label>
                <div style="display: flex; gap: 15px; margin-top: 5px;">
                    <label><input type="radio" name="txt_gender" value="Male" required> Male</label>
                    <label><input type="radio" name="txt_gender" value="Female"> Female</label>
                    <label><input type="radio" name="txt_gender" value="Others"> Others</label>
                </div>
            </div>

            <!-- Contact -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>Contact</label>
                <input type="text" name="txt_contact" required pattern="[7-9]{1}[0-9]{9}" 
                    title="Phone number with 7-9 and remaining 9 digits with 0-9" 
                    style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
            </div>

            <!-- Email -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>Email</label>
                <input type="email" name="txt_email" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
            </div>

            <!-- Password -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>Password</label>
                <input type="password" name="txt_password" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
            </div>

            <!-- Confirm Password -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>Confirm Password</label>
                <input type="password" name="txt_conpassword" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
            </div>

            <!-- District -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>District</label>
                <select name="sel_district" id="sel_district" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
                    <option value="">--Select District--</option>
                    {% for i in districtdata %}
                    <option value="{{ i.id }}">{{ i.district_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Place -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>Place</label>
                <select name="sel_place" id="sel_place" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
                    <option value="">--Select Place--</option>
                </select>
            </div>

            <!-- Address -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>Address</label>
                <textarea name="txt_address" rows="3" required style="width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1;"></textarea>
            </div>

            <!-- Photo -->
            <div class="form-group" style="margin-bottom: 18px;">
                <label>Photo</label>
                <input type="file" name="txt_photo" required style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1;">
            </div>

            <!-- Buttons -->
            <!-- <div class="form-group" style="text-align: center; margin-top: 25px;">
                <input type="submit" value="Submit" style="padding: 12px 35px; background: #0d9488; color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
                <a href="{% url 'Guest:NewUser' %}">
                    <input type="button" value="Cancel" style="padding: 12px 35px; background: #6b7280; color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
                </a>
            </div> -->
 <div class="text-center mt-3">
                            <input type="submit" value="Register" class="btn btn-primary w-100 mb-2" style="background: #0d9488; border:none;">
                            <a href="{% url 'Guest:NewUser' %}" class="btn btn-secondary w-100" style="background: #6b7280; border:none;">Cancel</a>
                        </div>
        </form>
    </div>
</div>

<!-- AJAX for Place -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $('#sel_district').change(function () {
        var did = $(this).val();
        var ur = "{% url 'Guest:AjaxPlace' %}";
        $.ajax({
            url: ur,
            data: { did: did },
            success: function (data) {
                $('#sel_place').html(data);
            }
        });
    });
</script>

{% if msg %}
<script>
    alert("{{ msg }}");
    window.location="{% url 'Guest:NewUser' %}";
</script>
{% endif %}

{% endblock content %}
