{% extends 'Guest/Head.html' %}
{% block content %}

<!-- Login Section -->
<section class="login-area pt-5 pb-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="login-box bg-white shadow-sm rounded p-4">

                    <h2 class="text-center mb-3" style="color: #1e3a8a;">RIDEX</h2>
                    <p class="text-center text-muted mb-4">Smart Ride Booking Platform</p>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="txt_email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="txt_password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>

                   <div class="mt-3 text-center" style="color: black;">
    <a href="{% url 'Guest:NewUser' %}" style="color: black;">New User</a> |
    <a href="{% url 'Guest:NewSeller' %}" style="color: black;">New Seller</a> |
    <a href="{% url 'Guest:DriverRegistration' %}" style="color: black;">New Driver</a>
</div>

                </div>
            </div>
        </div>
    </div>
</section>

{% if msg %}
<script>
    alert("{{ msg }}");
    window.location = "{% url 'Guest:Login' %}";
</script>
{% endif %}
