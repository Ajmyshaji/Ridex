{% extends 'Guest/Head.html' %}
{% block content %}
{% load static %}

<!-- Driver Registration Section -->
<section class="login-area pt-5 pb-5" style="background: #f4f6fb;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="login-box bg-white shadow-sm rounded p-4">

                    <!-- Page Title -->
                    <h2 class="text-center mb-3" style="color: #1e3a8a;">Become a <span style="color:#f97316;">RIDEX</span> Driver</h2>
                    <p class="text-center text-muted mb-4">Smart Ride Booking Platform</p>

                    <!-- Driver Registration Form -->
                    <form action="" method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="txt_name" class="form-control" required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="txt_email" class="form-control" required>
                        </div>

                        <!-- Contact -->
                        <div class="mb-3">
                            <label class="form-label">Contact</label>
                            <input type="text" name="txt_contact" class="form-control" required
                                   pattern="[7-9]{1}[0-9]{9}"
                                   title="Phone number with 7-9 and remaining 9 digits">
                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="txt_address" class="form-control" rows="3" required></textarea>
                        </div>

                        <!-- Photo -->
                        <div class="mb-3">
                            <label class="form-label">Photo</label>
                            <input type="file" name="txt_photo" class="form-control" required>
                        </div>

                        <!-- License -->
                        <div class="mb-3">
                            <label class="form-label">License</label>
                            <input type="file" name="txt_license" class="form-control" required>
                        </div>

                        <!-- District -->
                        <div class="mb-3">
                            <label class="form-label">District</label>
                            <select name="sel_district" id="sel_district" class="form-control" required>
                                <option value="">--Select District--</option>
                                {% for i in districtdata %}
                                <option value="{{i.id}}">{{i.district_name}}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Place -->
                        <div class="mb-3">
                            <label class="form-label">Place</label>
                            <select name="sel_place" id="sel_place" class="form-control" required>
                                <option value="">--Select Place--</option>
                            </select>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="txt_password" class="form-control" required>
                        </div>

                        <!-- Buttons -->
                        <div class="text-center mt-3">
                            <input type="submit" value="Register Now" class="btn btn-primary w-100 mb-2" style="background:#f97316; border:none;">
                            <a href="{% url 'Guest:DriverRegistration' %}" class="btn btn-secondary w-100" style="background:#6b7280; border:none;">Cancel</a>
                        </div>

                    </form>

                    <!-- Footer Links -->
                   

                </div>
            </div>
        </div>
    </div>
</section>

<!-- AJAX for Place -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $('#sel_district').change(function () {
        var did = $(this).val();
        var ur = "{% url 'Guest:AjaxPlace' %}";
        $.ajax({
            url: ur,
            data: { did: did },
            success: function (data) {
                $('#sel_place').html(data);
            }
        });
    });
</script>

{% if msg %}
<script>
    alert("{{ msg }}");
    window.location="{% url 'Guest:DriverRegistration' %}";
</script>
{% endif %}

{% endblock content %}
